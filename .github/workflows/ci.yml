name: CI

# Build the whole solution and run the unit tests on every push and pull request
# targeting the main branches. WpfApp targets net10.0-windows, so the whole job
# must run on a Windows runner.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore LanguageCenter.slnx

      - name: Build (Release)
        run: dotnet build LanguageCenter.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test LanguageCenter.slnx --configuration Release --no-build --verbosity normal
